<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquina de Bebidas - Parte 1</title>
</head>
<body>
  <main>
    <header>
      <h1>MÁQUINA POP</h1>
      <p>Escolha sua bebida</p>
    </header>

    <section>
      <h2>Bebidas disponíveis</h2>
      <div id="listaBebidas">
        <p>As bebidas aparecerão aqui.</p>
      </div>
    </section>

    <aside>
      <h2>Créditos inseridos</h2>
      <div id="visorValor">R$ 0,00</div>
      <p id="infoRefri">Nenhuma bebida selecionada</p>

      <h2>Moedas</h2>
      <div>
        <div>R$ 0,25</div>
        <div>R$ 0,50</div>
        <div>R$ 1,00</div>
      </div>
      <div id="slotMoedas">Solte as moedas aqui</div>
    </aside>

    <section id="mensagem">Insira moedas e escolha uma bebida.</section>
    <section id="saida">Nenhuma bebida liberada.</section>
  </main>
</body>
</html>
