<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquina de Bebidas - Parte 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="caixa">
      <h1>MÁQUINA POP</h1>
      <p>Escolha sua bebida</p>
    </header>

    <div class="painel">
      <section class="caixa">
        <h2>Bebidas disponíveis</h2>
        <div id="listaBebidas">
          <p>As bebidas aparecerão aqui.</p>
        </div>
      </section>

      <aside class="caixa">
        <h2>Créditos</h2>
        <div id="visorValor">R$ 0,00</div>
        <p id="infoRefri">Nenhuma bebida selecionada</p>
        <h2>Moedas</h2>
        <div>R$ 0,25 | R$ 0,50 | R$ 1,00</div>
        <div id="slotMoedas">Solte as moedas aqui</div>
      </aside>
    </div>

    <section class="caixa" id="mensagem">Insira moedas e escolha uma bebida.</section>
    <section class="caixa" id="saida">Nenhuma bebida liberada.</section>
  </main>
</body>
</html>
