<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Máquina de Bebidas - Arthur Amorim Ruschel (17024102)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="maquina" aria-label="Máquina de bebidas">
    <header class="topo">
      <strong>MÁQUINA ICMC</strong>
      <span>Arraste as moedas<br>e escolha sua bebida</span>
    </header>
    
    <section class="painel">
      <section class="visor-bebidas" aria-label="Bebidas disponíveis">
        <div class="lista-bebidas" id="listaBebidas"></div>
      </section>
      
      <aside class="painel-lateral" aria-label="Painel lateral">
        <div class="visor-credito">
          <strong>Créditos inseridos</strong>
          <div id="visorValor" class="valor">R$ 0,00</div>
          <div id="infoRefri" class="info-refri">Nenhuma bebida selecionada</div>
        </div>
        
        <div class="moedas" aria-label="Moedas">
          <div class="moedas-titulo">Moedas (arraste até o slot)</div>
          <div class="moedas-lista">
            <div class="moeda" draggable="true" data-valor="0.25">R$ 0,25</div>
            <div class="moeda" draggable="true" data-valor="0.50">R$ 0,50</div>
            <div class="moeda" draggable="true" data-valor="1.00">R$ 1,00</div>
          </div>
          <div class="area-drop">
            <div id="slotMoedas" class="slot-moedas">Solte as moedas aqui</div>
          </div>
        </div>
      </aside>
    </section>
    
    <section id="mensagem" class="mensagem">Insira moedas e escolha uma bebida.</section>
    
    <section class="saida" id="saida">
      <span>Nenhuma bebida liberada.</span>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
